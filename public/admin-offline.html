<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6f4" />
    <title>Sin conexión | Butter Love Admin</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #fbfaf8;
        color: #37352f;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 22rem;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #787774;
      }
      button {
        margin-top: 1.5rem;
        width: 100%;
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 0.375rem;
        background: #37352f;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
      }
      button:active {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/admin-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>
        El panel necesita internet para mostrar ventas e inventario al día.
        Revisa tu conexión y vuelve a intentarlo.
      </p>
      <button type="button" onclick="location.replace('/admin')">
        Reintentar
      </button>
    </main>
  </body>
</html>
